# socialvisualizer-llama-index LoRA 학습 설정
# 채택 체크포인트: checkpoint-513 (eval_loss=0.2565)
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
dataset_dir: /workspace/llamafactory-venv/data
# v4(extract_graph, 1,775개: mailgrapher_v4_email + mailgrapher_v4_messenger)
# + community_reports(950개) = 총 2,725개 예제, 513 step
dataset: mailgrapher_v4_email,mailgrapher_v4_messenger,mailgrapher_v5_community_reports
eval_dataset: mailgrapher_v4_email_val,mailgrapher_v4_messenger_val,mailgrapher_v5_community_reports_val
cutoff_len: 12288
template: llama3
overwrite_cache: true
preprocessing_num_workers: 8
output_dir: /workspace/ckpt/mailgrapher-llama-v5-lora
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
logging_steps: 10
eval_strategy: steps
eval_steps: 50
save_steps: 100
save_total_limit: 2
load_best_model_at_end: true
