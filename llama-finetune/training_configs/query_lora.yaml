# socialvisualizer-llama-query LoRA 학습 설정
# 채택 체크포인트: checkpoint-80 (eval_loss=0.5625)
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
stage: sft
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
dataset: mailgrapher_v5_local_search,mailgrapher_v5_global_search
eval_dataset: mailgrapher_v5_local_search_val,mailgrapher_v5_global_search_val
cutoff_len: 32768
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 8.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
eval_steps: 20
save_steps: 20
save_total_limit: 3
load_best_model_at_end: true
output_dir: /workspace/ckpt/mailgrapher-llama-query-lora
