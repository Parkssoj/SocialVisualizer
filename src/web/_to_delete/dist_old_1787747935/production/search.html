<html lang="ko">

    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=()"
    />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link
      rel="apple-touch-icon"
      href="images/apple-touch-icon.svg"
      sizes="180x180"
    />

    <title>Natural language search | MailGrapher</title>
    <!-- 헤더 폰트를 홈 화면(index.html)과 완전히 동일하게: Fraunces뿐 아니라
         Geist도 같이 불러와서 헤더/본문 폰트 로딩이 페이지마다 다르지 않게 통일 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0,0,9..144,100..900&family=Geist:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <script type="module" crossorigin src="/js/search-DjlmqgR2.js"></script>
    <link rel="modulepreload" crossorigin href="/js/security-DCyHwxIZ.js">
    <link rel="modulepreload" crossorigin href="/js/vendor-core-DUiz9rHY.js">
    <link rel="modulepreload" crossorigin href="/js/main-app-CS03Vr8n.js">
    <link rel="stylesheet" crossorigin href="/assets/security-C2LwTJTN.css">
    <link rel="stylesheet" crossorigin href="/assets/search-BOqRX56p.css">
  </head>

  <body class="page-search">
    <div class="container body">
      <div class="main_container">
        <div id="app-header"></div>

        <!-- Page Content -->
        <main
          class="right_col"
          role="main"
          aria-label="Main content"
          style="padding: 0"
        >
          <!-- ── 탭 전환 ── -->
          <div class="gw-tabs" role="tablist">
            <button
              type="button"
              class="gw-tab-btn active"
              id="tab-btn-mail"
              role="tab"
              aria-selected="true"
            >
              <i class="bi bi-envelope"></i> 메일
            </button>
            <button
              type="button"
              class="gw-tab-btn"
              id="tab-btn-message"
              role="tab"
              aria-selected="false"
            >
              <i class="bi bi-chat-dots"></i> 메신저
            </button>
          </div>

          <!-- ═══ 메일 탭: 검색 패널 ═══ -->
          <div id="panel-mail" class="gw-tab-panel active">
            <div class="gw-search-top">
              <div class="gw-search-box">
                <input
                  type="text"
                  id="search-input"
                  placeholder="메일에 대해 궁금한 것을 검색하세요..."
                  autocomplete="off"
                />
                <button id="search-btn" type="button">
                  <i class="fas fa-search"></i>
                </button>
              </div>
              <div
                class="gw-recent-searches"
                id="recent-searches-bar"
                style="display: none"
              >
                <span class="gw-recent-label"
                  ><i class="fas fa-history me-1"></i>최근 검색:</span
                >
                <div id="recent-tags"></div>
                <span class="gw-recent-clear" id="clear-recent">전체 삭제</span>
              </div>
            </div>
            <div class="gw-result-wrapper">
              <div id="result-container">
                <div class="gw-empty">
                  <i class="bi bi-search"></i>
                  <p>검색어를 입력해 메일을 분석하세요.</p>
                </div>
              </div>
            </div>
          </div>

          <!-- ═══ 메시지 탭: 카카오톡 대화 검색 ═══ -->
          <div id="panel-message" class="gw-tab-panel">
            <div class="gw-search-top">
              <div class="gw-search-box">
                <input
                  type="text"
                  id="message-search-input"
                  placeholder="카카오톡 대화에 대해 궁금한 것을 검색하세요..."
                  autocomplete="off"
                />
                <button id="message-search-btn" type="button">
                  <i class="fas fa-search"></i>
                </button>
              </div>
              <div
                class="gw-recent-searches"
                id="message-recent-searches-bar"
                style="display: none"
              >
                <span class="gw-recent-label"
                  ><i class="fas fa-history me-1"></i>최근 검색:</span
                >
                <div id="message-recent-tags"></div>
                <span class="gw-recent-clear" id="message-clear-recent"
                  >전체 삭제</span
                >
              </div>
            </div>
            <div class="gw-result-wrapper">
              <div id="message-result-container">
                <div class="gw-empty">
                  <i class="bi bi-chat-dots"></i>
                  <p>검색어를 입력해 카카오톡 대화를 분석하세요.</p>
                </div>
              </div>
            </div>
          </div>
        </main>
        <!-- /Page Content -->

        <footer id="app-footer"></footer>
      </div>
    </div>
  </body>
</html>
