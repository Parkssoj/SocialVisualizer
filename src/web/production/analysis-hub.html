<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link
      rel="apple-touch-icon"
      href="images/apple-touch-icon.svg"
      sizes="180x180"
    />
    <title>View results | MailGrapher</title>

    <script type="module" src="/src/pages/analysis-hub.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0,0,9..144,100..900&family=Geist:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>

  <body class="page-analysis-hub">
    <div class="container body">
      <div class="main_container">
        <!-- 공통 헤더가 렌더링될 자리 -->
        <div id="app-header"></div>

        <!-- 본문 영역 -->
        <main class="right_col" role="main" aria-label="Main content">
          <div class="gw-collect-wrap">
            <!-- ── 상단 타이틀 영역 ── -->
            <div class="gw-page-header-row">
              <div class="gw-page-header-left">
                <div class="gw-page-title">
                  <i class="bi bi-grid-fill"></i>
                  View results
                </div>
                <p class="gw-page-subtitle">
                  원하시는 분석 항목을 선택하여 상세 결과를 확인하세요.
                </p>
              </div>
            </div>

            <!-- ── 4개의 버튼 카드 (그리드 레이아웃) ── -->
            <div class="gw-hub-grid">
              <!-- 메뉴 1: My People -->
              <a href="mypeople.html" class="gw-hub-card">
                <div class="gw-hub-title">My People</div>
                <div class="gw-hub-desc">
                  사람 중심의 관계망을 시각화합니다.
                </div>
                <div class="gw-hub-img-wrap">
                  <img
                    src="/images/hero/MyPeople.png"
                    alt="My People"
                    onerror="
                      this.src =
                        'https://via.placeholder.com/600x300?text=My+People'
                    "
                  />
                </div>
              </a>

              <!-- 메뉴 2: My Time -->
              <a href="mytime.html" class="gw-hub-card">
                <div class="gw-hub-title">My Time</div>
                <div class="gw-hub-desc">시간 중심의 정보를 시각화합니다.</div>
                <div class="gw-hub-img-wrap">
                  <img
                    src="/images/hero/My Time.png"
                    alt="My Time"
                    onerror="
                      this.src =
                        'https://via.placeholder.com/600x300?text=My+Time'
                    "
                  />
                </div>
              </a>

              <!-- 메뉴 3: Recap -->
              <a href="recap.html" class="gw-hub-card">
                <div class="gw-hub-title">Recap</div>
                <div class="gw-hub-desc">데이터의 전체 통계를 제공합니다.</div>
                <div class="gw-hub-img-wrap">
                  <img
                    src="/images/hero/hero-bg.png"
                    alt="Recap"
                    onerror="
                      this.src =
                        'https://via.placeholder.com/600x300?text=Recap'
                    "
                  />
                </div>
              </a>

              <!-- 메뉴 4: Search -->
              <a href="search.html" class="gw-hub-card">
                <div class="gw-hub-title">Natural language search</div>
                <div class="gw-hub-desc">
                  데이터에서 원하는 정보를 자연어로 검색합니다.
                </div>
                <div class="gw-hub-img-wrap">
                  <img
                    src="/images/hero/sphere.png"
                    alt="Search"
                    onerror="
                      this.src =
                        'https://via.placeholder.com/600x300?text=Search'
                    "
                  />
                </div>
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
