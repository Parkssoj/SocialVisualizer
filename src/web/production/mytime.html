<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!--
  "My Time" 타임라인 페이지 진입 HTML.

  Entry HTML for the "My Time" timeline page.
-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:*; frame-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" type="image/x-icon" />
    <link rel="icon" href="/images/logos/socialvisualizer.png" type="image/png" />
    <link rel="apple-touch-icon" href="/images/logos/socialvisualizer.png" sizes="231x231" />
    <title>Social Visualizer</title>
    <script type="module" src="/src/pages/mytime.js"></script>
    <!-- 헤더 폰트를 홈 화면(index.html)과 완전히 동일하게: Fraunces뿐 아니라
         Geist도 같이 불러와서 헤더/본문 폰트 로딩이 페이지마다 다르지 않게 통일 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0,0,9..144,100..900&family=Geist:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>

  <body class="page-mytime">
    <div class="container body">
      <div class="main_container">
        <div id="app-header"></div>

        <!-- 공통 사이드바 컨테이너 (My People/Recap과 동일) -->
        <div id="app-sidebar"></div>

        <main class="right_col" role="main">
          <div class="mt-page">
            <div class="mt-page-header">
              <div class="mt-title-group">
                <div class="mt-title">My <span>Time</span></div>
                <span class="mt-count" id="mtDataRangeLbl"></span>
              </div>
            </div>

            <!-- 메일 뷰 (기본 표시) -->
            <div class="mt-view" id="mt-mail-view">
              <!-- 전체 타임라인(연도 슬라이드)을 두 창 위로 올림 -->
              <div class="mt-pointer-wrap">
                <div class="mt-pointer-dates">
                  <span class="mt-pointer-date-label" id="mtPointerRangeLbl"
                    >—</span
                  >
                </div>
                <div class="mt-pointer-track" id="pointerTrack">
                  <div class="mt-pointer-bg"></div>
                  <div class="mt-pointer-window" id="pointerWindow"></div>
                  <div class="mt-pointer-cursor" id="pointerCursor">
                    <span class="mt-pointer-cursor-fallback">나</span>
                  </div>
                </div>
                <div class="mt-pointer-axis" id="pointerAxis"></div>
              </div>

              <!-- 두 창(5:5) 구성: 왼쪽 = 타임슬라이더 + 요약 + 주요 연락처,
                   오른쪽 = 월별 키워드 -->
              <div class="mt-two-col">
                <div class="mt-col-main">
                  <div class="mt-main" id="mainCard">
                    <div class="mt-track" id="track"></div>
                    <div class="mt-info-area">
                      <div class="mt-panel" id="infoPanel">
                        <div class="mt-panel-top">
                          <div class="mt-panel-period" id="panelPeriod"></div>
                          <div class="mt-panel-count" id="panelCount"></div>
                        </div>
                        <div class="mt-panel-summary" id="panelSummary"></div>
                        <div class="mt-panel-contacts-title">주요 연락처</div>
                        <div class="mt-panel-contacts" id="panelContacts"></div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 오른쪽 창: 월별 키워드 -->
                <div class="mt-kw-panel mt-card" id="mtKwPanel">
                  <div class="mt-kw-header">
                    <div class="mt-kw-title" id="mtKwTitle">키워드</div>
                    <button
                      type="button"
                      class="mt-kw-back-btn"
                      id="mtKwBackBtn"
                      style="display: none"
                    >
                      <i class="bi bi-arrow-left"></i
                      ><span>키워드 목록으로</span>
                    </button>
                  </div>
                  <div class="mt-kw-hint" id="mtKwHint">
                    키워드를 클릭하시면 일별 그래프가 나타납니다.
                  </div>
                  <div class="mt-kw-body" id="mtKwBody"></div>
                </div>
              </div>
            </div>

            <!-- 메신저 뷰: 메일 뷰와 동일한 구성(왼쪽 이미지 칸 + 타임라인 트랙 + 요약 패널
                 + 전체 타임라인). 첫 클릭 시 mytime.js가 /chatroom-summaries를 불러와 채움,
                 기본은 숨김 -->
            <div class="mt-view" id="mt-messenger-view" style="display: none">
              <div class="mt-pointer-wrap">
                <div class="mt-pointer-dates">
                  <span class="mt-pointer-date-label" id="msgPointerRangeLbl"
                    >—</span
                  >
                </div>
                <div class="mt-pointer-track" id="msgPointerTrack">
                  <div class="mt-pointer-bg"></div>
                  <div class="mt-pointer-window" id="msgPointerWindow"></div>
                  <div class="mt-pointer-cursor" id="msgPointerCursor">
                    <span class="mt-pointer-cursor-fallback">나</span>
                  </div>
                </div>
                <div class="mt-pointer-axis" id="msgPointerAxis"></div>
              </div>

              <div class="mt-two-col">
                <div class="mt-col-main">
                  <div class="mt-main" id="msgMainCard">
                    <div class="mt-track" id="msgTrack"></div>
                    <div class="mt-info-area">
                      <div class="mt-panel" id="msgInfoPanel">
                        <div class="mt-panel-top">
                          <div
                            class="mt-panel-period"
                            id="msgPanelPeriod"
                          ></div>
                        </div>
                        <div
                          class="mt-panel-summary"
                          id="msgPanelSummary"
                        ></div>
                        <div class="mt-panel-contacts-title">주요 연락처</div>
                        <div
                          class="mt-panel-contacts"
                          id="msgPanelContacts"
                        ></div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- 오른쪽 창: 월별 키워드 -->
                <div class="mt-kw-panel mt-card" id="msgKwPanel">
                  <div class="mt-kw-header">
                    <div class="mt-kw-title" id="msgKwTitle">키워드</div>
                    <button
                      type="button"
                      class="mt-kw-back-btn"
                      id="msgKwBackBtn"
                      style="display: none"
                    >
                      <i class="bi bi-arrow-left"></i
                      ><span>키워드 목록으로</span>
                    </button>
                  </div>
                  <div class="mt-kw-hint" id="msgKwHint">
                    키워드를 클릭하시면 일별 그래프가 나타납니다.
                  </div>
                  <div class="mt-kw-body" id="msgKwBody"></div>
                </div>
              </div>
            </div>
          </div>
        </main>
        <footer id="app-footer"></footer>
      </div>
    </div>
  </body>
</html>
