<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:* https://*.ngrok-free.dev https://*.ngrok-free.app https://*.ngrok.io; frame-src 'none'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=()"
    />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
    <link
      rel="apple-touch-icon"
      href="images/apple-touch-icon.svg"
      sizes="180x180"
    />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="rgb(42, 63, 84)" />
    <title>데이터 업로드 | MailGrapher</title>
    <script type="module" src="/src/pages/imap-collect.js"></script>
    <!-- 헤더 폰트를 홈 화면(index.html)과 완전히 동일하게: Fraunces뿐 아니라
         Geist도 같이 불러와서 헤더/본문 폰트 로딩이 페이지마다 다르지 않게 통일 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0,0,9..144,100..900&family=Geist:wght@400;500;600&display=block"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>

  <body class="page-imap-collect">
    <div class="container body">
      <div class="main_container">
        <div id="app-header"></div>

        <!-- Page Content -->
        <main class="right_col" role="main" aria-label="Main content">
          <div class="gw-collect-wrap">
            <div class="gw-page-title">
              <i class="bi bi-inbox-fill"></i>
              데이터 업로드
            </div>

            <p class="gw-page-subtitle">
              메일 또는 카카오톡 대화는 Social Visualizer 서비스를 제공하는데
              사용됩니다.
            </p>

            <!-- ── 탭 전환 ── -->
            <div class="gw-tabs" role="tablist">
              <button
                type="button"
                class="gw-tab-btn active"
                id="tab-btn-mail"
                role="tab"
                aria-selected="true"
              >
                <i class="bi bi-envelope"></i> 메일
              </button>
              <button
                type="button"
                class="gw-tab-btn"
                id="tab-btn-message"
                role="tab"
                aria-selected="false"
              >
                <i class="bi bi-chat-dots"></i> 메시지
              </button>
            </div>

            <!-- ═══ 메일 탭 ═══ -->
            <div
              class="gw-tab-panel active"
              id="tab-panel-mail"
              role="tabpanel"
            >
              <!-- ── 카드 1+2를 가로 1줄로 배치 ── -->
              <div class="gw-collect-cards-row">
                <!-- ── 카드 1: IMAP 서버 설정 ── -->
                <div class="gw-card">
                  <div class="gw-card-title">
                    <i class="bi bi-server"></i>
                    메일 계정 로그인
                  </div>

                  <!-- 프리셋 -->
                  <div class="gw-presets">
                    <div
                      class="gw-preset-chip active"
                      data-host="imap.gmail.com"
                      data-port="993"
                      data-domain="gmail.com"
                    >
                      <i class="bi bi-google"></i> Gmail
                    </div>
                    <div
                      class="gw-preset-chip"
                      data-host="imap.naver.com"
                      data-port="993"
                      data-domain="naver.com"
                    >
                      <i class="bi bi-envelope"></i> 네이버
                    </div>
                    <div
                      class="gw-preset-chip"
                      data-host="imap.mail.me.com"
                      data-port="993"
                      data-domain="icloud.com"
                    >
                      <i class="bi bi-apple"></i> iCloud
                    </div>
                    <div
                      class="gw-preset-chip"
                      data-host=""
                      data-port="993"
                      data-domain=""
                    >
                      <i class="bi bi-gear"></i> 직접 입력
                    </div>
                  </div>

                  <div
                    class="gw-form-grid gw-uniform-grid"
                    id="imap-server-grid"
                  >
                    <div class="gw-form-group">
                      <label class="gw-label">이메일 주소</label>
                      <input
                        id="imap-user"
                        class="gw-input"
                        type="text"
                        placeholder="you@example.com"
                        value="@gmail.com"
                      />
                    </div>
                    <div class="gw-form-group">
                      <label class="gw-label">앱 비밀번호</label>
                      <input
                        id="imap-pass"
                        class="gw-input"
                        type="password"
                        placeholder="앱 전용 비밀번호"
                      />
                    </div>
                  </div>

                  <!-- IMAP 호스트/포트/SSL — UI에서는 숨김(프리셋 칩으로 자동 설정됨), 값은 그대로 전송용으로 유지 -->
                  <div class="gw-hidden-fields">
                    <div class="gw-form-group">
                      <label class="gw-label">IMAP 호스트</label>
                      <input
                        id="imap-host"
                        class="gw-input"
                        type="text"
                        value="imap.gmail.com"
                        placeholder="imap.example.com"
                      />
                    </div>
                    <div class="gw-form-group">
                      <label class="gw-label">포트</label>
                      <input
                        id="imap-port"
                        class="gw-input"
                        type="number"
                        value="993"
                        placeholder="993"
                      />
                    </div>
                    <div class="gw-form-group">
                      <label class="gw-label">SSL</label>
                      <select id="imap-ssl" class="gw-select">
                        <option value="true" selected>사용 (993)</option>
                        <option value="false">미사용 (143)</option>
                      </select>
                    </div>
                  </div>

                  <div
                    style="
                      margin-top: 16px;
                      display: flex;
                      align-items: center;
                      gap: 12px;
                    "
                  >
                    <button
                      type="button"
                      class="gw-preset-chip"
                      id="list-folders-btn"
                      style="cursor: pointer"
                    >
                      <i class="bi bi-arrow-clockwise"></i> 폴더 불러오기
                    </button>
                    <span
                      id="folder-list-hint"
                      style="font-size: 1rem; color: #73879c"
                    ></span>
                  </div>
                </div>

                <!-- ── 카드 2: 옵션 ── -->
                <div class="gw-card">
                  <div class="gw-card-title">
                    <i class="bi bi-sliders"></i>
                    옵션
                  </div>

                  <!-- 폴더 선택 ("폴더 불러오기" 버튼으로 동적으로 채워짐) -->
                  <div class="gw-form-group" style="margin-bottom: 18px">
                    <div
                      style="
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        margin-bottom: 10px;
                      "
                    >
                      <label class="gw-label" style="margin-bottom: 0"
                        >불러온 폴더</label
                      >
                      <button
                        type="button"
                        class="gw-select-all-btn"
                        id="select-all-btn"
                        style="display: none"
                      >
                        전체 선택
                      </button>
                    </div>
                    <div class="gw-folder-list" id="folder-list">
                      <span class="gw-folder-empty"
                        >"폴더 불러오기"를 눌러 수집할 폴더를 선택하세요.</span
                      >
                    </div>
                  </div>

                  <div
                    class="gw-form-grid gw-uniform-grid"
                    id="imap-collect-grid"
                  >
                    <div class="gw-form-group">
                      <label class="gw-label">수집 개수 (폴더당)</label>
                      <select id="collect-limit" class="gw-select">
                        <option value="50">50개</option>
                        <option value="100">100개</option>
                        <option value="200">200개</option>
                        <option value="500">500개</option>
                        <option value="0" selected>전체</option>
                        <option value="custom">사용자 지정</option>
                      </select>
                      <input
                        type="number"
                        id="collect-limit-custom"
                        class="gw-input"
                        placeholder="개수 입력"
                        min="1"
                        style="display: none; margin-top: 8px"
                      />
                    </div>
                    <div class="gw-form-group">
                      <label class="gw-label">모드</label>
                      <select id="sync-mode" class="gw-select">
                        <option value="append">업데이트 안된 메일만</option>
                        <option value="rewrite" selected>전체 업데이트</option>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <!-- /.gw-collect-cards-row -->

              <!-- ── 수집 버튼 ── -->
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 14px;
                  flex-wrap: wrap;
                "
              >
                <button class="gw-collect-btn" id="collect-btn">
                  <div class="gw-spinner" id="collect-spinner"></div>
                  <i class="bi bi-download" id="collect-icon"></i>
                  메일 수집 시작
                </button>
                <span
                  id="collect-hint"
                  style="font-size: 1rem; color: #73879c"
                ></span>
              </div>

              <!-- ── 진행상황 패널 목록 (계정별로 하나씩 쌓임) ── -->
              <div class="gw-jobs-list" id="jobs-list">
                <div class="gw-log-empty" id="jobs-list-empty">
                  <i class="bi bi-clock-history" style="font-size: 1.2rem"></i>
                  수집을 시작하면 이곳에 로그가 표시됩니다.
                </div>
              </div>
            </div>
            <!-- /#tab-panel-mail -->

            <!-- ═══ 메시지 탭 ═══ -->
            <div class="gw-tab-panel" id="tab-panel-message" role="tabpanel">
              <!-- ── 카드 1: 대화 파일 업로드 ── -->
              <div class="gw-card">
                <div class="gw-card-title">
                  <i class="bi bi-file-earmark-text"></i>
                  카카오톡 대화 파일
                </div>

                <label
                  class="gw-dropzone"
                  id="message-dropzone"
                  for="message-file-input"
                >
                  <i class="bi bi-cloud-arrow-up"></i>
                  <div class="gw-dropzone-text">
                    대화 내보내기 .txt 파일을 여기로 끌어다 놓거나 클릭해서
                    선택하세요.
                  </div>
                  <div class="gw-dropzone-sub">
                    카카오톡 채팅방에서 대화내보내기가 가능합니다.
                  </div>
                  <div
                    class="gw-dropzone-file"
                    id="message-file-name"
                    style="display: none"
                  ></div>
                </label>
                <input
                  type="file"
                  id="message-file-input"
                  accept=".txt"
                  style="display: none"
                />

                <div class="gw-form-grid" style="margin-top: 18px">
                  <div class="gw-form-group">
                    <label class="gw-label">대화방 이름</label>
                    <input
                      id="message-room-name"
                      class="gw-input"
                      type="text"
                      placeholder="예: 가족톡"
                    />
                  </div>
                  <div class="gw-form-group">
                    <label class="gw-label">동기 모드</label>
                    <select id="message-sync-mode" class="gw-select">
                      <option value="append" selected>
                        업데이트 안된 메일만
                      </option>
                      <option value="rewrite">전체 업데이트</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- ── 업로드 버튼 ── -->
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 14px;
                  flex-wrap: wrap;
                "
              >
                <button class="gw-collect-btn" id="message-upload-btn">
                  <div class="gw-spinner" id="message-upload-spinner"></div>
                  <i class="bi bi-upload" id="message-upload-icon"></i>
                  대화 업로드 시작
                </button>
                <span
                  id="message-upload-hint"
                  style="font-size: 1rem; color: #73879c"
                ></span>
              </div>

              <!-- ── 진행상황 패널 목록 ── -->
              <div class="gw-jobs-list" id="message-jobs-list">
                <div class="gw-log-empty" id="message-jobs-list-empty">
                  <i class="bi bi-clock-history" style="font-size: 1.2rem"></i>
                  업로드를 시작하면 이곳에 로그가 표시됩니다.
                </div>
              </div>
            </div>
            <!-- /#tab-panel-message -->
          </div>
          <!-- /.gw-collect-wrap -->
        </main>
        <!-- /Page Content -->
      </div>
    </div>
  </body>
</html>
